<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No `user-scalable=no` / `maximum-scale=1`: disabling pinch-zoom is an
      accessibility anti-pattern flagged by the web interface guidelines.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --color-canvas so mobile browser chrome blends with the page. -->
    <meta name="theme-color" content="#E7E8E4" />
    <meta
      name="description"
      content="Cognitive DataOps. Spatial sensor mapping and a digital twin asset pipeline for industrial operations."
    />

    <!--
      Fonts are self-hosted through @fontsource (see src/main.jsx): no request
      leaves this origin, the console works offline at a campus demo, and the
      privacy page can truthfully say no third party is contacted.
    -->

    <title>Cognitive DataOps: twin console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
