<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Cognitive DataOps</title>
  <desc id="d">Edge telemetry from a welding robot and a stamping press flows through MQTT into a digital twin, where a Python agent diagnoses faults and points at the failing part.</desc>
  <rect width="1200" height="360" fill="#135E66"/>
  <rect x="0" y="0" width="1200" height="6" fill="#151D1C"/>

  <!-- brand mark -->
  <rect x="64" y="58" width="58" height="58" fill="none" stroke="#F9FAF8" stroke-width="5"/>
  <rect x="88" y="82" width="58" height="58" fill="#F9FAF8"/>

  <text x="176" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#F9FAF8">Cognitive DataOps</text>
  <text x="178" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#F9FAF8" opacity="0.9">Agentic contextualization of edge telemetry for digital twins</text>

  <!-- the agent pointing back at the twin -->
  <path d="M994 214 V184 H664 V214" stroke="#F9FAF8" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/>
  <path d="M664 214 l-7 -10 h14z" fill="#F9FAF8"/>
  <text x="829" y="174" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#F9FAF8">report, and the failing part lit in red</text>

  <!-- flow boxes -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#151D1C">
    <rect x="64" y="214" width="210" height="96" fill="#F9FAF8"/>
    <text x="82" y="244" font-size="18" font-weight="700">Edge</text>
    <text x="82" y="268">ESP32 robot and press</text>
    <text x="82" y="291" font-size="14" fill="#56625F">2 Hz, 64-bin spectrum</text>

    <rect x="334" y="214" width="210" height="96" fill="#F9FAF8"/>
    <text x="352" y="244" font-size="18" font-weight="700">MQTT and Node</text>
    <text x="352" y="268">validate, store, detect</text>
    <text x="352" y="291" font-size="14" fill="#56625F">MongoDB time series</text>

    <rect x="604" y="214" width="210" height="96" fill="#F9FAF8"/>
    <text x="622" y="244" font-size="18" font-weight="700">3D twin</text>
    <text x="622" y="268">bind, watch, inspect</text>
    <text x="622" y="291" font-size="14" fill="#56625F">React Three Fiber</text>

    <rect x="874" y="214" width="262" height="96" fill="#151D1C"/>
    <text x="892" y="244" font-size="18" font-weight="700" fill="#F9FAF8">Python agent</text>
    <text x="892" y="268" fill="#F9FAF8">diagnose, cite, point</text>
    <text x="892" y="291" font-size="14" fill="#F9FAF8" opacity="0.8">LangGraph, MCP, Gemini</text>
  </g>

  <!-- connectors -->
  <g stroke="#F9FAF8" stroke-width="3" fill="none">
    <path d="M274 262 H324"/><path d="M544 262 H594"/><path d="M814 262 H864"/>
  </g>
  <g fill="#F9FAF8">
    <path d="M334 262 l-10 -7 v14z"/><path d="M604 262 l-10 -7 v14z"/><path d="M874 262 l-10 -7 v14z"/>
  </g>
</svg>
